name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # Docker is preinstalled, which Testcontainers needs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Runs unit tests (surefire) and Testcontainers integration tests (failsafe).
      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  # Builds the Docker image and exercises the real multi-container stack
  # (api + 3 workers + postgres + redis). Build-only: nothing is pushed anywhere.
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test (builds image, starts stack, submits jobs, tears down)
        run: ./scripts/smoke-test.sh
